name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validation:
    if: startsWith(github.ref, 'refs/tags/v')
    uses: ./.github/workflows/validate.yml

  build_and_release:
    name: Build and publish release asset
    needs: validation
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: read
      pull-requests: read

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14"
          check-latest: true

      - name: Audit public GitHub surfaces
        env:
          GH_TOKEN: ${{ github.token }}
          UNIFI_UNAS_FORBIDDEN_MARKERS: ${{ vars.UNIFI_UNAS_FORBIDDEN_MARKERS }}
        run: python scripts/audit_github_public_surfaces.py --repo "$GITHUB_REPOSITORY"

      - name: Verify release tag matches manifest
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          manifest = json.loads(Path("custom_components/unifi_unas/manifest.json").read_text())
          expected = f"v{manifest['version']}"
          if os.environ["RELEASE_TAG"] != expected:
              raise SystemExit(f"Release tag must be {expected}")
          PY

      - name: Run repository release preflight
        env:
          UNIFI_UNAS_FORBIDDEN_MARKERS: ${{ vars.UNIFI_UNAS_FORBIDDEN_MARKERS }}
        run: python scripts/check_repo.py

      - name: Build HACS release ZIP
        run: |
          mkdir -p dist
          cd custom_components
          zip -r ../dist/unifi_unas.zip unifi_unas -x "*/__pycache__/*" "*.pyc"

      - name: Validate release ZIP privacy, legal and layout
        env:
          UNIFI_UNAS_FORBIDDEN_MARKERS: ${{ vars.UNIFI_UNAS_FORBIDDEN_MARKERS }}
        run: python scripts/check_release_zip.py dist/unifi_unas.zip

      - name: Upload release ZIP artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: unifi_unas_release_zip
          path: dist/unifi_unas.zip

      - name: Resolve release notes
        id: release_notes
        run: |
          notes=".github/release-notes/${GITHUB_REF_NAME}.md"
          if [ ! -f "$notes" ]; then
            echo "Missing release notes: $notes" >&2
            exit 1
          fi
          echo "body_path=$notes" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          files: dist/unifi_unas.zip
          body_path: ${{ steps.release_notes.outputs.body_path }}
          generate_release_notes: false
