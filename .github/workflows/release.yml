name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validation:
    if: startsWith(github.ref, 'refs/tags/v')
    uses: ./.github/workflows/validate.yml

  build_and_release:
    name: Build and publish release asset
    needs: validation
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: read
      pull-requests: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
          check-latest: true

      - name: Audit public GitHub surfaces
        env:
          GH_TOKEN: ${{ github.token }}
          UNIFI_UNAS_FORBIDDEN_MARKERS: ${{ vars.UNIFI_UNAS_FORBIDDEN_MARKERS }}
        run: python scripts/audit_github_public_surfaces.py --repo "$GITHUB_REPOSITORY"

      - name: Verify release tag matches manifest
        id: release_metadata
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          from scripts.release_version import is_prerelease, validate_version

          manifest = json.loads(Path("custom_components/unifi_unas/manifest.json").read_text())
          expected = f"v{validate_version(manifest['version'])}"
          if os.environ["RELEASE_TAG"] != expected:
              raise SystemExit(f"Release tag must be {expected}")
          beta = is_prerelease(expected)
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              print(f"prerelease={'true' if beta else 'false'}", file=output)
              print(f"make_latest={'false' if beta else 'true'}", file=output)
          PY

      - name: Run repository release preflight
        env:
          UNIFI_UNAS_FORBIDDEN_MARKERS: ${{ vars.UNIFI_UNAS_FORBIDDEN_MARKERS }}
        run: python scripts/check_repo.py

      - name: Build HACS release ZIP
        run: |
          mkdir -p dist
          cd custom_components
          zip -r ../dist/unifi_unas.zip unifi_unas -x "*/__pycache__/*" "*.pyc"

      - name: Validate release ZIP privacy, legal and layout
        env:
          UNIFI_UNAS_FORBIDDEN_MARKERS: ${{ vars.UNIFI_UNAS_FORBIDDEN_MARKERS }}
        run: python scripts/check_release_zip.py dist/unifi_unas.zip

      - name: Upload release ZIP artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unifi_unas_release_zip
          path: dist/unifi_unas.zip

      - name: Resolve release notes
        id: release_notes
        run: |
          notes=".github/release-notes/${GITHUB_REF_NAME}.md"
          if [ ! -f "$notes" ]; then
            echo "Missing release notes: $notes" >&2
            exit 1
          fi
          echo "body_path=$notes" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          files: dist/unifi_unas.zip
          body_path: ${{ steps.release_notes.outputs.body_path }}
          generate_release_notes: false
          prerelease: ${{ steps.release_metadata.outputs.prerelease }}
          make_latest: ${{ steps.release_metadata.outputs.make_latest }}

      - name: Verify published tag, notes and installation artifact
        env:
          GH_TOKEN: ${{ github.token }}
          UNIFI_UNAS_FORBIDDEN_MARKERS: ${{ vars.UNIFI_UNAS_FORBIDDEN_MARKERS }}
        run: python scripts/release_check.py --ref "$GITHUB_SHA" --published --repo "$GITHUB_REPOSITORY"
