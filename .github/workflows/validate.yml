name: Validate

on:
  push:
    branches:
      - main
      - "v*"
      - chore/**
      - feature/**
  pull_request:
  schedule:
    - cron: "0 3 * * 0"
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: HACS validation
        uses: hacs/action@1ebf01c408f29afcb6406bd431bc98fd8cbb15aa # main
        with:
          category: integration

  hassfest:
    name: Hassfest
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Hassfest validation
        uses: home-assistant/actions/hassfest@50baf3a307f87100cf550d4ae127746595030d5d # master

  repository_checks:
    name: Repository checks
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - homeassistant: "2024.8.0"
            python: "3.12"
            pytest_homeassistant: "0.13.152"
          - homeassistant: "2026.10.4"
            python: "3.14"
            pytest_homeassistant: "0.13.375"
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
          check-latest: true

      - name: Install test dependencies
        run: |
          python -m pip install \
            -c "https://raw.githubusercontent.com/home-assistant/core/${{ matrix.homeassistant }}/homeassistant/package_constraints.txt" \
            -r requirements/ci/requirements.txt \
            "homeassistant==${{ matrix.homeassistant }}" \
            "pytest-homeassistant-custom-component==${{ matrix.pytest_homeassistant }}" \
            "josepy<2.0; python_version < '3.13'"
          python -m pip check

      - name: Verify Home Assistant test version
        run: |
          python - <<'PY'
          import os
          import importlib.metadata as md

          expected = os.environ["EXPECTED_HOMEASSISTANT_VERSION"]
          version = md.version("homeassistant")
          if version != expected:
              raise SystemExit(f"Expected Home Assistant {expected}, got {version}")
          print(f"Home Assistant test version: {version}")
          PY
        env:
          EXPECTED_HOMEASSISTANT_VERSION: ${{ matrix.homeassistant }}

      - name: Run repository checks
        env:
          UNIFI_UNAS_FORBIDDEN_MARKERS: ${{ vars.UNIFI_UNAS_FORBIDDEN_MARKERS }}
        run: python scripts/check_repo.py

      - name: Run lint checks
        run: ruff check custom_components tests scripts

      - name: Run typing checks
        run: |
          mypy --config-file mypy.ini
          mypy --config-file mypy-ha.ini

      - name: Run security checks
        run: bandit -q -r custom_components scripts

      - name: Run complete test suite
        env:
          PYTEST_ADDOPTS: ${{ matrix.python == '3.14' && '-o asyncio_default_fixture_loop_scope=function' || '' }}
        run: python -m coverage run -m pytest -q

      - name: Enforce coverage floor
        run: python -m coverage report

      - name: Compile integration and tests
        run: python -m compileall -q custom_components/unifi_unas tests

      - name: Check diff whitespace
        run: git diff --check

      - name: Measure extended runtime resources
        if: matrix.python == '3.14' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        env:
          PYTEST_ADDOPTS: -o asyncio_default_fixture_loop_scope=function
        run: python scripts/check_runtime_soak.py --cycles 30 --idle-seconds 1 --json-output "${{ runner.temp }}/unas-soak.json"

      - name: Check out pinned companion card
        if: matrix.python == '3.14' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: memphi2/ha-unifi-drive-card
          ref: da31de9c54de4a7144c6a1c22cd60c4f6132ed01
          path: .ci-card
          persist-credentials: false

      - name: Set up Node for contract verification
        if: matrix.python == '3.14' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'

      - name: Verify fresh HA entities against the card
        if: matrix.python == '3.14' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        env:
          PYTEST_ADDOPTS: -o asyncio_default_fixture_loop_scope=function
        run: |
          npm ci --prefix .ci-card
          python scripts/check_card_contract.py --card-root .ci-card --json-output "${{ runner.temp }}/unas-card-contract.json"

      - name: Retain synthetic runtime and contract evidence
        if: always() && matrix.python == '3.14' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: synthetic-runtime-contract-${{ github.sha }}
          path: |
            ${{ runner.temp }}/unas-soak.json
            ${{ runner.temp }}/unas-card-contract.json
          retention-days: 14
          if-no-files-found: error
