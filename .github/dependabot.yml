version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "quarterly"
      time: "05:00"
      timezone: "Europe/Berlin"
    open-pull-requests-limit: 1
    groups:
      github-actions:
        applies-to: version-updates
        patterns:
          - "*"
    commit-message:
      prefix: "deps"

  - package-ecosystem: "pip"
    directory: "/requirements/ci"
    schedule:
      interval: "quarterly"
      time: "05:00"
      timezone: "Europe/Berlin"
    open-pull-requests-limit: 1
    groups:
      python-ci-tools:
        applies-to: version-updates
        patterns:
          - "*"
    commit-message:
      prefix: "deps"

# Security updates remain separate from these scheduled version-update groups.
# HA and its matching test helper stay in the CI matrix, not the tool manifest.
