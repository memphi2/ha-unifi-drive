rules:
  action-setup:
    status: done
    comment: Services are registered from async_setup.
  appropriate-polling:
    status: done
    comment: Coordinator polling enforces a practical local API interval.
  brands:
    status: done
    comment: HACS metadata stays self-contained and no official vendor assets are bundled.
  common-modules:
    status: done
    comment: API, discovery, diagnostics, storage, snapshot and entity helpers are split.
  config-flow-test-coverage:
    status: done
    comment: Config flow helpers and critical setup paths are covered.
  config-flow:
    status: done
    comment: Setup, discovery, reauth and reconfigure are UI-driven.
  dependency-transparency:
    status: done
    comment: The external discovery dependency and its minimum version are declared in manifest.json; it is not exactly pinned.
  docs-actions:
    status: done
    comment: README documents services and entity actions.
  docs-high-level-description:
    status: done
    comment: README describes the local-first UniFi Drive / UNAS integration.
  docs-installation-instructions:
    status: done
    comment: README and docs/installation.md cover Marketplace, older HACS installs, manual installation and the pre-0.8.0 upgrade.
  docs-removal-instructions:
    status: done
    comment: README and docs/installation.md separate config-entry deletion, Marketplace/HACS uninstall and manual file removal.
  entity-event-setup:
    status: done
    comment: Dynamic entity listeners are registered through entry unload cleanup.
  entity-unique-id:
    status: done
    comment: Entities use stable entry and target based unique IDs.
  has-entity-name:
    status: done
    comment: Entities use Home Assistant entity naming.
  runtime-data:
    status: done
    comment: Loaded runtime coordinator is stored on ConfigEntry.runtime_data.
  test-before-configure:
    status: done
    comment: Setup validation connects before creating an entry.
  test-before-setup:
    status: done
    comment: First refresh validates entry setup before platforms load.
  unique-config-entry:
    status: done
    comment: Discovery identity and connection validation prevent duplicates.

  action-exceptions:
    status: done
    comment: Services and control entities raise HA exceptions on failures.
  config-entry-unloading:
    status: done
    comment: Unload removes platforms, runtime data and dynamic snapshot tracking.
  docs-configuration-parameters:
    status: done
    comment: README documents setup and feature options.
  docs-installation-parameters:
    status: done
    comment: README documents host, SSL, credentials, API key and WOL parameters.
  entity-unavailable:
    status: done
    comment: Coordinator-backed entities become unavailable while offline or unsupported.
  integration-owner:
    status: done
    comment: manifest.json has codeowners.
  log-when-unavailable:
    status: done
    comment: Coordinator logs outage and recovery transitions without repeated noise.
  parallel-updates:
    status: done
    comment: Every platform declares PARALLEL_UPDATES.
  reauthentication-flow:
    status: done
    comment: Reauth flow updates credentials while preserving device identity.
  test-coverage:
    status: done
    comment: CI enforces the coverage gate; latest local line coverage is above 95%.

  devices:
    status: done
    comment: Entities are attached to a Home Assistant device for the configured UNAS.
  diagnostics:
    status: done
    comment: Versioned privacy-safe diagnostics are implemented and tested.
  discovery-update-info:
    status: done
    comment: Trusted discovery metadata updates entry identity without forced reloads.
  discovery:
    status: done
    comment: UniFi local discovery and zeroconf setup are supported.
  docs-data-update:
    status: done
    comment: README documents polling, cached offline data and optional endpoint handling.
  docs-examples:
    status: done
    comment: README includes safe automation examples.
  docs-known-limitations:
    status: done
    comment: README documents known limitations separately from bugs.
  docs-supported-devices:
    status: done
    comment: README documents current tested and expected compatible device scope.
  docs-supported-functions:
    status: done
    comment: README capability matrix documents supported functions and platforms.
  docs-troubleshooting:
    status: done
    comment: README contains user troubleshooting guidance.
  docs-use-cases:
    status: done
    comment: README includes practical monitoring and automation use cases.
  dynamic-devices:
    status: done
    comment: Dynamic pools, drives and snapshot targets add entities after setup without creating child devices.
  entity-category:
    status: done
    comment: Diagnostic and configuration entities use appropriate categories.
  entity-device-class:
    status: done
    comment: Entities use HA device/state classes and units where applicable.
  entity-disabled-by-default:
    status: done
    comment: Noisy detailed telemetry is disabled by default.
  entity-translations:
    status: done
    comment: Entity names are translated through strings.json and en.json.
  exception-translations:
    status: done
    comment: User-facing service and entity action errors use translation keys.
  icon-translations:
    status: done
    comment: Entity icons are supplied through icons.json instead of Python icon state.
  reconfiguration-flow:
    status: done
    comment: Reconfigure flow supports connection and feature option changes.
  repair-issues:
    status: done
    comment: Snapshot target issues are privacy-safe and clear automatically.
  stale-devices:
    status: done
    comment: Config-entry device removal allows HA-managed device records to be removed without a restart cycle.

  async-dependency:
    status: done
    comment: Local API and UniFi discovery usage are async in HA runtime paths.
  inject-websession:
    status: done
    comment: The local API client receives a Home Assistant-created aiohttp session.
  strict-typing:
    status: todo
    comment: Typed runtime ConfigEntry and strict mypy gate now cover setup/unload, coordinator, runtime, API client/mixins, config-flow helper, diagnostics, discovery, shared entity base, repairs, services, snapshot, storage and support modules; config-flow service/control surfaces and some HA platform layers remain.
