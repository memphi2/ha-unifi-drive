[lint]
# Keep the release lint gate stable across Ruff releases. Broader rule families
# are enabled deliberately, not implicitly through upstream default changes.
select = ["E4", "E7", "E9", "F"]

[lint.per-file-ignores]
# Legacy compatibility modules intentionally re-export imported helper names.
"custom_components/unifi_unas/api_snapshot.py" = ["F401"]
"custom_components/unifi_unas/storage_helpers.py" = ["F401"]

# Platform imports happen after Home Assistant setup imports so HA does not
# first import platform modules while setting up the config entry.
"custom_components/unifi_unas/__init__.py" = ["E402", "F401"]

# These imports prime modules patched by pytest-homeassistant-custom-component.
"tests/conftest.py" = ["F401"]
