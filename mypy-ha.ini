[mypy]
strict = True
follow_imports = silent
disallow_any_unimported = True
disallow_any_expr = True
show_error_codes = True
files = scripts/typecheck_ha_contract.py, custom_components/unifi_unas/device.py,
    custom_components/unifi_unas/runtime.py,
    custom_components/unifi_unas/entity_base.py,
    custom_components/unifi_unas/entry_reload.py,
    custom_components/unifi_unas/sensor_descriptions.py,
    custom_components/unifi_unas/binary_sensor_descriptions.py

[mypy-custom_components.unifi_unas.device]
disallow_any_expr = False

[mypy-custom_components.unifi_unas.runtime,custom_components.unifi_unas.entity_base,custom_components.unifi_unas.entry_reload,custom_components.unifi_unas.sensor_descriptions,custom_components.unifi_unas.binary_sensor_descriptions]
# Dynamic device/config payloads remain Any; imported HA symbols must not be Any.
disallow_any_expr = False

[mypy-custom_components.unifi_unas.sensor_descriptions,custom_components.unifi_unas.binary_sensor_descriptions]
disallow_any_expr = False
# The primary skip-import gate still needs the existing base-class misc ignores.
warn_unused_ignores = False

[mypy-homeassistant.components.binary_sensor]
# HA's public device-class re-export is not annotated with an explicit alias.
implicit_reexport = True
